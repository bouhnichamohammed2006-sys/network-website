
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partage GPS</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
      padding: 16px;
      margin: 0;
    }

    .card {
      max-width: 480px;
      margin: 30px auto;
      padding: 22px;
      background: #1e293b;
      border-radius: 15px;
      box-shadow: 0 10px 30px #0003;
    }

    h1 {
      color: #86efac;
      font-size: 26px;
    }

    .description {
      color: #cbd5e1;
      line-height: 1.7;
    }

    button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 16px;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .primary {
      background: #22c55e;
      color: #052e16;
    }

    .stop {
      background: #f87171;
      color: #450a0a;
    }

    #code {
      overflow-wrap: anywhere;
      color: #86efac;
      font-size: 13px;
      padding: 10px;
      background: #0f172a;
      border-radius: 8px;
    }

    #status {
      overflow-wrap: anywhere;
      line-height: 1.6;
      color: #bfdbfe;
    }

    .note {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.6;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>📍 Partage GPS</h1>

    <p class="description">
      Partagez votre position uniquement avec une personne
      de confiance, après avoir donné votre accord.
    </p>

    <button id="createBtn" class="primary">
      1. Créer un code secret
    </button>

    <p id="code">Aucune session créée.</p>

    <button id="copyBtn" class="primary" disabled>
      Copier le code
    </button>

    <button id="startBtn" class="primary" disabled>
      2. Démarrer le partage GPS
    </button>

    <button id="stopBtn" class="stop" disabled>
      Arrêter le partage
    </button>

    <p id="status">Connexion à Firebase...</p>

    <p class="note">
      Votre position ne sera partagée qu'après votre autorisation.
      Vous pouvez arrêter le partage à tout moment.
    </p>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInAnonymously
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getDatabase,
      ref,
      set
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBaqab6yuUvIhJ3XSiV93qgRivl7z5OOfo",
      authDomain: "myphonegps.firebaseapp.com",
      databaseURL: "https://myphonegps-default-rtdb.firebaseio.com",
      projectId: "myphonegps",
      storageBucket: "myphonegps.firebasestorage.app",
      messagingSenderId: "93340951825",
      appId: "1:93340951825:web:16ad8a2321d4d2c2a498b0",
      measurementId: "G-0LR1706DJZ"
    };

    const createBtn = document.getElementById("createBtn");
    const copyBtn = document.getElementById("copyBtn");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const codeDisplay = document.getElementById("code");
    const status = document.getElementById("status");

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let user = null;
    let roomCode = null;
    let watchId = null;
    let sharing = false;

    try {
      const result = await signInAnonymously(auth);
      user = result.user;
      status.textContent =
        "Connexion réussie. Vous pouvez créer une session.";
    } catch (error) {
      status.textContent =
        "Erreur Firebase : " + error.message;
      createBtn.disabled = true;
    }

    createBtn.addEventListener("click", async () => {
      if (!user) {
        status.textContent = "Connexion Firebase impossible.";
        return;
      }

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      sharing = false;
      roomCode = null;
      startBtn.disabled = true;
      stopBtn.disabled = true;
      copyBtn.disabled = true;
      createBtn.disabled = true;
      codeDisplay.textContent = "Création en cours...";

      try {
        const bytes = crypto.getRandomValues(new Uint8Array(32));
        const newCode = Array.from(
          bytes,
          byte => byte.toString(16).padStart(2, "0")
        ).join("");

        await set(ref(db, `rooms/${newCode}/ownerUid`), user.uid);

        roomCode = newCode;
        codeDisplay.textContent = "Code secret : " + roomCode;
        startBtn.disabled = false;
        copyBtn.disabled = false;

        status.textContent =
          "Session créée. Vous pouvez démarrer le partage GPS.";
      } catch (error) {
        status.textContent =
          "Erreur de création : " + error.message;
      } finally {
        createBtn.disabled = false;
      }
    });

    copyBtn.addEventListener("click", async () => {
      if (!roomCode) return;

      try {
        await navigator.clipboard.writeText(roomCode);
        status.textContent = "Code copié avec succès.";
      } catch {
        status.textContent =
          "Copie impossible. Sélectionnez et copiez le code manuellement.";
      }
    });

    startBtn.addEventListener("click", () => {
      if (!roomCode || !user || sharing) return;

      if (!navigator.geolocation) {
        status.textContent =
          "La géolocalisation n'est pas prise en charge.";
        return;
      }

      sharing = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      status.textContent =
        "Demande d'autorisation de localisation...";

      watchId = navigator.geolocation.watchPosition(
        async position => {
          if (!sharing || !roomCode) return;

          const location = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            accuracy: position.coords.accuracy,
            timestamp: Date.now()
          };

          try {
            await set(
              ref(db, `rooms/${roomCode}/location`),
              location
            );

            if (sharing) {
              status.textContent =
                "Partage GPS actif. Votre position est actualisée.";
            }
          } catch (error) {
            status.textContent =
              "Erreur d'envoi Firebase : " + error.message;
          }
        },
        error => {
          status.textContent = "Erreur GPS : " + error.message;
          sharing = false;

          if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
          }

          startBtn.disabled = false;
          stopBtn.disabled = true;
        },
        {
          enableHighAccuracy: true,
          maximumAge: 5000,
          timeout: 20000
        }
      );
    });

    stopBtn.addEventListener("click", async () => {
      sharing = false;

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      startBtn.disabled = !roomCode;
      stopBtn.disabled = true;
      status.textContent = "Arrêt du partage...";

      if (roomCode && user) {
        try {
          await set(ref(db, `rooms/${roomCode}/location`), null);
          status.textContent =
            "Partage arrêté. La dernière position a été supprimée.";
        } catch (error) {
          status.textContent =
            "GPS arrêté, mais suppression impossible : " +
            error.message;
        }
      } else {
        status.textContent = "Partage GPS arrêté.";
      }
    });

    window.addEventListener("pagehide", () => {
      sharing = false;

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
      }
    });
  </script>
</body>
</html>
